# Builds Soccer Lab for real iPhones and uploads it to App Store Connect, where it shows up in TestFlight after Apple
# processes it (10-30 minutes). Started by hand only (Actions tab, or `gh workflow run testflight.yml`).
#
# Signing is MANUAL: Xcode's automatic (cloud) signing was refused for this team ("Authentication failed"), so the
# certificate and App Store profiles were made once through the App Store Connect API (2026-11-15) and live here as
# secrets. Repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (Admin), used for the upload
#   DIST_P12_BASE64, DIST_P12_PASSWORD      "Apple Distribution: Muhammad Ali" certificate + its private key (.p12)
#   PROFILE_APP_BASE64                      App Store profile for com.skillerai.ios ("Soccer Lab App Store")
#   PROFILE_WIDGETS_BASE64                  App Store profile for com.skillerai.ios.widgets ("Soccer Lab Widgets App Store")
# The local copies are in C:\Users\asher\.soccerlab-signing (keep them private; the certificate expires 2027-11-15).
# Optional (the app runs without them; the matching feature stays off):
#   REVENUECAT_API_KEY, POSTHOG_PROJECT_TOKEN, APISPORTS_KEY, HIGHLIGHTLY_KEY, UNSPLASH_ACCESS_KEY
#
# App group: until group.com.skillerai.ios is assigned to both App IDs on developer.apple.com (and the profiles are
# made again), the profiles carry no app group, so this build leaves the app-group entitlement out. The app works;
# the home-screen widget just can't read the app's data.
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Check the secrets are there
        env:
          ID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          P12: ${{ secrets.DIST_P12_BASE64 }}
          PA: ${{ secrets.PROFILE_APP_BASE64 }}
          PW: ${{ secrets.PROFILE_WIDGETS_BASE64 }}
        run: |
          [ -n "$ID" ] || { echo "::error::ASC_KEY_ID secret is missing"; exit 1; }
          [ -n "$ISS" ] || { echo "::error::ASC_ISSUER_ID secret is missing"; exit 1; }
          echo "$P8" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::ASC_KEY_P8 must be the whole .p8 file text"; exit 1; }
          [ -n "$P12" ] || { echo "::error::DIST_P12_BASE64 secret is missing"; exit 1; }
          [ -n "$PA" ] && [ -n "$PW" ] || { echo "::error::PROFILE_APP_BASE64 / PROFILE_WIDGETS_BASE64 missing"; exit 1; }

      - name: Write the key and app settings
        env:
          ID: ${{ secrets.ASC_KEY_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          # altool looks for the key here
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$P8" | tr -d '\r' | sed -e '1s/^\xEF\xBB\xBF//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' > "$HOME/.appstoreconnect/private_keys/AuthKey_$ID.p8"
          {
            echo "REVENUECAT_API_KEY = $REVENUECAT_API_KEY"
            echo "POSTHOG_PROJECT_TOKEN = $POSTHOG_PROJECT_TOKEN"
            echo "APISPORTS_KEY = $APISPORTS_KEY"
            echo "HIGHLIGHTLY_KEY = $HIGHLIGHTLY_KEY"
            echo "UNSPLASH_ACCESS_KEY = $UNSPLASH_ACCESS_KEY"
          } > Secrets.xcconfig
          TEAM=$(sed -nE 's/.*DEVELOPMENT_TEAM = ([A-Z0-9]{10});.*/\1/p' SoccerMax.xcodeproj/project.pbxproj | head -1)
          echo "TEAM=$TEAM" >> "$GITHUB_ENV"
          # every upload needs a build number Apple hasn't seen: 7 + this workflow's run number
          echo "BUILD=$((7 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Install the certificate and profiles
        env:
          P12: ${{ secrets.DIST_P12_BASE64 }}
          P12PW: ${{ secrets.DIST_P12_PASSWORD }}
          PA: ${{ secrets.PROFILE_APP_BASE64 }}
          PW: ${{ secrets.PROFILE_WIDGETS_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC"
          for D in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do mkdir -p "$D"; done
          for P in app:"$PA" widgets:"$PW"; do
            N=${P%%:*}; echo "${P#*:}" | base64 --decode > "$RUNNER_TEMP/$N.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/$N.mobileprovision" > "$RUNNER_TEMP/$N.plist"
            U=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/$N.plist")
            NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/$N.plist")
            cp "$RUNNER_TEMP/$N.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$U.mobileprovision"
            cp "$RUNNER_TEMP/$N.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$U.mobileprovision"
            echo "profile $N: $NAME ($U)"
            UP=$(echo "$N" | tr a-z A-Z); echo "PROFILE_${UP}_NAME=$NAME" >> "$GITHUB_ENV"
            # does the profile carry the app group yet?
            if /usr/libexec/PlistBuddy -c "Print Entitlements:com.apple.security.application-groups:0" "$RUNNER_TEMP/$N.plist" >/dev/null 2>&1; then
              echo "  app group: yes"
            else
              echo "  app group: not assigned yet"; echo "NO_APP_GROUP=1" >> "$GITHUB_ENV"
            fi
          done

      - name: Switch the project to manual signing (this run only)
        run: |
          if [ "${NO_APP_GROUP:-}" = "1" ]; then
            echo "::warning::App group not on the profiles yet: building without it (widget won't show the app's data)."
            plutil -remove com.apple.security.application-groups SoccerMax/SoccerMax.entitlements
            plutil -remove com.apple.security.application-groups SoccerMaxWidgets/SoccerMaxWidgets.entitlements
          fi
          python3 - <<'PY'
          import os, re
          p = "SoccerMax.xcodeproj/project.pbxproj"
          s = open(p, encoding="utf-8").read()
          want = {"com.skillerai.ios": os.environ["PROFILE_APP_NAME"], "com.skillerai.ios.widgets": os.environ["PROFILE_WIDGETS_NAME"]}
          def fix(m):
              block = m.group(0)
              bid = re.search(r"PRODUCT_BUNDLE_IDENTIFIER = ([\w.]+);", block)
              if not bid or bid.group(1) not in want or "name = Release;" not in block:
                  return block
              block = re.sub(r'\n\s*(CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]") = [^;]*;', "", block)
              add = ('\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
                     f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{want[bid.group(1)]}";')
              print("manual signing:", bid.group(1), "->", want[bid.group(1)])
              return block.replace("buildSettings = {", "buildSettings = {" + add, 1)
          s2 = re.sub(r"\w+ /\* Release \*/ = \{\s*isa = XCBuildConfiguration;.*?name = Release;\s*\};", fix, s, flags=re.S)
          assert s2.count("CODE_SIGN_STYLE = Manual;") == 2, "expected 2 Release targets"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.skillerai.ios</key><string>$PROFILE_APP_NAME</string>
              <key>com.skillerai.ios.widgets</key><string>$PROFILE_WIDGETS_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project SoccerMax.xcodeproj -scheme SoccerMax -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SoccerMax.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION="$BUILD" DEVELOPMENT_TEAM="$TEAM" \
            archive 2>&1 | tee archive.log | grep -E "error:|warning: unre|ARCHIVE|^\*\*" || true
          test -d "$RUNNER_TEMP/SoccerMax.xcarchive"

      - name: Export the .ipa
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SoccerMax.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            2>&1 | tee export.log | tail -20
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        env:
          ID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ID" --apiIssuer "$ISS" 2>&1 | tee upload.log | tail -30
          grep -qiE "No errors uploading|UPLOAD SUCCEEDED|successfully uploaded" upload.log || { echo "::error::upload did not succeed"; exit 1; }
          echo "Uploaded version 2.0 build $BUILD. Apple takes 10-30 minutes to process it before it appears in TestFlight."

      - name: Show errors
        if: failure()
        run: grep -hE "error:|Error|rror Domain" archive.log export.log upload.log 2>/dev/null | sort -u | head -60 || true

      - name: Clean up the key and keychain
        if: always()
        run: |
          rm -rf "$HOME/.appstoreconnect/private_keys"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
            upload.log
          retention-days: 7
