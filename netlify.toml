# The website (Netlify, linked to this repo 2026-11-17): a push to main publishes the site/ folder as it is.
# No build step. Redirects live in site/_redirects.
# 2026-11-20: only pushes that CHANGE site/ are published. Before this, every app commit used a deploy and the
# month's free credits ran out. `ignore` exiting 0 = skip this deploy (skipped deploys cost nothing).
[build]
  publish = "site"
  command = ""
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"
