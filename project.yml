# Native SOCCER MAX app. Generate the Xcode project with:  xcodegen  (in app/native)
name: SoccerMax
options:
  bundleIdPrefix: com.jacksteiner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.59.3
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.99.2
targets:
  SoccerMax:
    type: application
    platform: iOS
    sources:
      - path: SoccerMax
        excludes: ["Stage/**", "Resources/**"]
      - path: SoccerMax/Stage
        type: folder
        buildPhase: resources
      - path: SoccerMax/Resources/Covers
        type: folder
        buildPhase: resources
      - path: SoccerMax/Resources/Gear
        type: folder
        buildPhase: resources
      - path: SoccerMax/Resources/Matchday
        type: folder
        buildPhase: resources
      - path: SoccerMax/Resources/Stadiums
        type: folder
        buildPhase: resources
      - path: SoccerMax/Resources/Technique
        type: folder
        buildPhase: resources
      - path: SoccerMax/Resources/Players
        type: folder
        buildPhase: resources
      - path: SoccerMax/Resources/DrillVideos
        type: folder
        buildPhase: resources
      - path: SoccerMax/Resources/Mascot
        type: folder
        buildPhase: resources
      - path: SoccerMax/Resources/library.json
        buildPhase: resources
      - path: SoccerMax/Resources/Fonts
        buildPhase: resources
      - path: SoccerMax/Resources/Portraits
        buildPhase: resources
      - path: SoccerMax/Resources/Assets.xcassets
    configFiles:
      Debug: Base.xcconfig
      Release: Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksteiner.soccermax
        PRODUCT_NAME: SoccerMax
        DEVELOPMENT_TEAM: M9YGAL979V
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: SoccerMax/Info.plist
        CODE_SIGN_ENTITLEMENTS: SoccerMax/SoccerMax.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: PostHog
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - target: SoccerMaxWidgets   # home-screen widgets (notes/34)
    scheme:
      # local StoreKit test products (monthly / yearly / lifetime) so the paywall buys in the simulator
      storeKitConfiguration: SoccerMax.storekit
  # Home-screen widgets: streak, match of the day, consistency squares (notes/34). Reads the App Group snapshot.
  SoccerMaxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SoccerMaxWidgets
        excludes: ["Info.plist", "*.entitlements"]
      - path: SoccerMax/Shared
      - path: SoccerMax/Resources/Fonts/LuckiestGuy-Regular.ttf
        buildPhase: resources
      - path: SoccerMax/Resources/Fonts/Fredoka-Bold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksteiner.soccermax.widgets
        PRODUCT_NAME: SoccerMaxWidgets
        DEVELOPMENT_TEAM: M9YGAL979V
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: SoccerMaxWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: SoccerMaxWidgets/SoccerMaxWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
